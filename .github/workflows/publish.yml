name: publish

on:
  push:
    tags: ['v*']
  # release-please tags with GITHUB_TOKEN, and GitHub suppresses the events it
  # creates — `workflow_dispatch` is exempt, so the release workflow dispatches
  # this one explicitly. No PAT is needed.
  workflow_dispatch:
    inputs:
      ref:
        description: Tag to publish (defaults to the dispatched ref)
        required: false

permissions:
  contents: read

jobs:
  publish:
    name: Publish to npm (OIDC trusted publishing)
    runs-on: ubuntu-24.04
    # Trusted publishing: no NPM_TOKEN anywhere. npm exchanges the GitHub OIDC
    # token for a short-lived, workflow-scoped publish credential, and the
    # resulting tarball carries a provenance attestation.
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: jdx/mise-action@v5
        with:
          install: true
          cache: true

      - name: Assert a trusted-publishing-capable npm
        run: |
          set -eu
          npm_version=$(npm --version)
          echo "npm $npm_version"
          # Trusted publishing requires npm >= 11.5.1.
          node -e '
            const [major, minor, patch] = process.argv[1].split(".").map(Number);
            const ok = major > 11 || (major === 11 && (minor > 5 || (minor === 5 && patch >= 1)));
            if (!ok) {
              console.error(`npm ${process.argv[1]} is too old for trusted publishing (need >= 11.5.1)`);
              process.exit(1);
            }
          ' "$npm_version"

      - name: Install dependencies
        run: mise run bootstrap-deps

      # Re-prove the artifact before publishing it: a tag is not evidence.
      - name: Tests
        run: mise run coverage

      - name: Build and publish
        run: |
          set +e
          mise run publish
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            cat >&2 <<'DIAGNOSIS'
          ────────────────────────────────────────────────────────────────────────
          npm could not authenticate to the registry.
          DIAGNOSIS
            # Which of the two causes is it? The job can answer that itself: with
            # `id-token: write`, GitHub exposes a request URL for the OIDC token
            # (the token itself is never printed here).
            if [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
              cat >&2 <<'NO_PUBLISHER'
          GitHub DID expose an OIDC token endpoint, so the workflow is entitled to
          authenticate — the missing piece is the trusted publisher on npm:

                 npm trust github "@deuriib/better-dgii-ecf" \
                   --file publish.yml \
                   --repo deuriib/better-dgii-ecf \
                   --allow-publish

          `--file` takes the workflow filename, not a path (2FA is required).
          Verify with `npm trust list @deuriib/better-dgii-ecf`.
          NO_PUBLISHER
            else
              cat >&2 <<'NO_OIDC'
          GitHub did NOT expose an OIDC token endpoint, so the job is missing
          `permissions: id-token: write`. Trusted publishing cannot work without it,
          and the npm side may already be configured correctly.
          NO_OIDC
            fi
            cat >&2 <<'RETRY'
          Re-dispatch without moving the tag (the tests run again first):

                 gh workflow run publish.yml --ref main -f ref=<tag>

          See docs/releasing.md.
          ────────────────────────────────────────────────────────────────────────
          RETRY
            exit "$status"
          fi

      - name: Verify the published attestation
        run: |
          set -eu
          package=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          echo "Published $package@$version"
          npm view "$package@$version" dist.integrity
